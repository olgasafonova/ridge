name: Release Binaries

# Builds platform binaries for a GitHub release and attaches them, plus a
# SHA256SUMS file, to that release.
#
# Triggers:
# - release published: builds the release's own tag.
# - workflow_dispatch with a tag: builds an existing tag. Use it for releases
#   cut before this workflow existed (v0.1.0). A release event runs the
#   workflow file from the tag's commit, so a tag without this file never
#   triggers it; dispatch runs the file from main and checks out the tag.
#
# Pattern per rules/release-workflows.md: matrix jobs only upload workflow
# artifacts, and one collecting job uploads release assets with
# `gh release upload --clobber`, so parallel jobs never race on the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    # go-tree-sitter needs cgo, so each binary builds on a native runner, as
    # in ci.yml. linux/arm64 is left out for the same reason ci.yml gives.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        shell: bash
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "ridge-${GOOS}-${GOARCH}${ext}" ./cmd/ridge

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ridge-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: ridge-*
          merge-multiple: true

      - name: Write checksums
        working-directory: artifacts
        run: |
          sha256sum ridge-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          count=$(ls artifacts/ridge-* | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 binaries, found $count"
            exit 1
          fi
          for file in artifacts/ridge-* artifacts/SHA256SUMS; do
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber --repo "$REPO"
          done
